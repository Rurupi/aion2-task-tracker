.card.dragging{
  opacity:.48!important;
  transform:scale(.985)!important;
  border-color:rgba(88,190,255,.55)!important;
  box-shadow:0 18px 38px rgba(0,0,0,.38),0 0 20px rgba(63,170,242,.12)!important;
}
.card.dropBefore,.card.dropAfter{position:relative}
.card.dropBefore::before,.card.dropAfter::after{
  content:""!important;
  position:absolute!important;
  top:-8px!important;bottom:-8px!important;
  width:4px!important;border-radius:5px!important;
  background:#62c9ff!important;
  box-shadow:0 0 8px #62c9ff,0 0 18px rgba(64,180,255,.7)!important;
  z-index:10!important;
}
.card.dropBefore::before{left:-10px!important}
.card.dropAfter::after{right:-10px!important}
@media(max-width:700px){
  .card.dropBefore::before,.card.dropAfter::after{
    left:-5px!important;right:-5px!important;top:-5px!important;bottom:auto!important;
    width:auto!important;height:3px!important;
  }
}

/* Character content collapse / expand */
.cardActions{display:flex;align-items:center;gap:13px}
.collapseBtn{
  width:28px!important;height:28px!important;padding:0!important;
  display:grid!important;place-items:center!important;border-radius:7px!important;
  border:1px solid rgba(89,165,219,.28)!important;
  background:linear-gradient(180deg,rgba(24,65,98,.8),rgba(12,39,64,.9))!important;
  color:#a8d5f2!important;font-size:17px!important;line-height:1!important;
  cursor:pointer!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)!important;
}
.collapseBtn:hover{
  color:#fff!important;border-color:rgba(99,194,255,.6)!important;
  background:linear-gradient(180deg,rgba(31,84,126,.95),rgba(15,50,80,.98))!important;
  box-shadow:0 0 11px rgba(65,169,236,.15)!important;
}
.cardContent{overflow:hidden;max-height:1200px;opacity:1;transition:max-height .25s ease,opacity .18s ease}
.card.collapsed .cardContent{max-height:0!important;opacity:0!important;pointer-events:none!important}
.card.collapsed{padding-bottom:10px!important}
.card.collapsed .head{margin-bottom:0!important}

/* Refined character header controls */

/* Compact character card when content is collapsed */
.card{
  transition:transform .16s ease,opacity .16s ease,border-color .16s ease,
             box-shadow .16s ease,padding .22s ease,min-height .22s ease!important;
}
.card.collapsed{
  min-height:0!important;
  height:auto!important;
  padding-top:10px!important;
  padding-bottom:10px!important;
}
.card.collapsed .head{
  min-height:30px!important;
  padding-top:0!important;
  padding-bottom:0!important;
  margin-top:0!important;
  margin-bottom:0!important;
}
.card.collapsed .cardContent{
  display:none!important;
}

/* FIX: don't let CSS Grid stretch collapsed cards to the tallest card in the row */
.grid{
  align-items:start!important;
}
.grid > .card{
  align-self:start!important;
  height:auto!important;
}
.grid > .card.collapsed{
  min-height:0!important;
  height:auto!important;

}

  display:none!important;

const ROLE_EN={
 '수호성':'Templar','검성':'Gladiator','살성':'Assassin','궁성':'Ranger',
 '마도성':'Sorcerer','정령성':'Spiritmaster','치유성':'Cleric','호법성':'Chanter','권성':'Fighter'
};
const ROLE_KO=Object.fromEntries(Object.entries(ROLE_EN).map(([k,v])=>[v,k]));
function roleLabel(role){
  if(currentLang==='en') return ROLE_EN[role]||role;
  return ROLE_KO[role]||role;
}

function classPickerMarkup(role){
  const emblem=CLASS_EMBLEMS[role];
  return `<span class="classPickerIconSlot">${emblem?`<img class="classPickerMiniEmblem" src="${emblem}" alt="">`:'<span class="classPickerPlaceholder"></span>'}</span><span class="classPickerText">${esc(roleLabel(role))}</span>`;
}
function renderClassPicker(){
  if(!window.classPickerMenu||!window.classPickerValue)return;
  classPickerValue.innerHTML=classPickerMarkup(charRole.value);
  classPickerMenu.innerHTML=[...charRole.options].map(o=>
    `<button type="button" class="classPickerOption ${o.value===charRole.value?'active':''}" data-role="${o.value}">${classPickerMarkup(o.value)}</button>`
  ).join('');
}
function applyStaticLanguage(){
  document.documentElement.lang=currentLang==='ko'?'ko':'en';
  document.querySelectorAll('.langBtn').forEach(b=>b.classList.toggle('active',b.dataset.lang===currentLang));
  addChar.textContent=tr('addChar');
  dailyReset.textContent=tr('dailyReset');
  weeklyReset.textContent=tr('weeklyReset'); manage.textContent=tr('manage');
  backup.textContent=tr('backup'); restore.textContent=tr('restore');

  const cf=document.querySelector('#charDlg form');
  cf.querySelector('h2').textContent=tr('charAddTitle');
  cf.querySelectorAll('label')[0].textContent=tr('charName');
  cf.querySelectorAll('label')[1].textContent=tr('role');
  createCharBtn.textContent=tr('create');

  const af=document.querySelector('#accountDlg form');
  af.querySelector('h2').textContent=tr('accountAddTitle');
  af.querySelector('label').textContent=tr('accountNickname');
  accountName.placeholder=tr('accountPlaceholder');
  createAccountBtn.textContent=tr('create');

  const tf=document.querySelector('#taskDlg form');
  tf.querySelector('h2').textContent=tr('contentManage');
  tf.querySelectorAll('label')[0].textContent=tr('category');
  tf.querySelectorAll('label')[1].textContent=tr('contentName');
  newTaskName.placeholder=tr('contentPlaceholder');
  addTaskBtn.textContent=tr('add');

  deleteAccountDlg.querySelector('h2').textContent=tr('accountDeleteTitle');
  deleteAccountDlg.querySelector('.deleteNote').textContent=tr('accountDeleteNote');
  deleteAccountCancel.textContent=tr('cancel'); deleteAccountConfirm.textContent=tr('delete');

  deleteCharDlg.querySelector('h2').textContent=tr('charDeleteTitle');
  deleteCharDlg.querySelector('.deleteNote').textContent=tr('charDeleteNote');
  deleteCharCancel.textContent=tr('cancel'); deleteCharConfirm.textContent=tr('delete');

  const roleSelect=document.getElementById('charRole');
  [...roleSelect.options].forEach(o=>o.textContent=roleLabel(o.value));
  renderClassPicker();
}

function renderMenu(){
  accountMenu.innerHTML=
    accounts.map(a=>`<button type="button" class="accountItem ${a.id===account?'active':''}" data-account="${a.id}">✦ ${esc(a.name)}</button>`).join('')+
    `<div class="accountMenuDivider"></div>
     <button type="button" class="accountAdd" id="addAccountBtn">${tr('addAccount')}</button>
     <button type="button" class="accountDeleteMenu" id="deleteAccountBtn" ${accounts.length<=1?'disabled':''}>${tr('deleteAccountMenu')}</button>`;
}
function switchAccount(id){if(!accounts.some(a=>a.id===id))return;save();account=id;localStorage.setItem(ACTIVE_KEY,id);data=loadData();accountMenu.classList.remove('open');render()}
function render(){let info=accounts.find(a=>a.id===account)||accounts[0];accountBtnText.textContent=`✦ ${info.name}`;renderMenu();summary.innerHTML=`<div class=pill>${tr('account')} <b>${esc(info.name)}</b></div><div class=pill>${tr('totalChars')} <b>${data.chars.length}</b></div>`;grid.innerHTML=data.chars.length?'':`
  <div class="empty emptyCharacterState">
    <div class="emptyCharacterText">${tr('empty')}</div>
    <button type="button" class="primary emptyAddCharBtn" id="emptyAddCharBtn">${tr('addChar')}</button>
  </div>`;data.chars.forEach((c,ci)=>{
    const dailyIdx=tasks.map((t,i)=>({t,i})).filter(x=>x.t[1]=='d').map(x=>x.i);
    const weeklyIdx=tasks.map((t,i)=>({t,i})).filter(x=>x.t[1]=='w').map(x=>x.i);
    const dailyDone=dailyIdx.filter(i=>c.done?.[i]).length;
    const weeklyDone=weeklyIdx.filter(i=>c.done?.[i]).length;
    const dailyPct=dailyIdx.length?Math.round(dailyDone/dailyIdx.length*100):0;
    const weeklyPct=weeklyIdx.length?Math.round(weeklyDone/weeklyIdx.length*100):0;
    let card=document.createElement('div');card.className='card';card.draggable=true;card.dataset.charIndex=ci;card.innerHTML=`<div class=head><div class="charIdentity">${CLASS_EMBLEMS[c.role]?`<img class="classEmblem" src="${CLASS_EMBLEMS[c.role]}" alt="">`:''}<div><div class=name>${esc(c.name)}</div><div class=role>${esc(roleLabel(c.role))}</div></div></div><div class="charProgress"><div class="charProgressBox"><div class="charProgressTop"><span class="charProgressLabel">DAILY</span><span class="charProgressPct">${dailyPct}%</span></div><div class="charProgressTrack"><div class="charProgressFill" style="width:${dailyPct}%"></div></div></div><div class="charProgressBox weekly"><div class="charProgressTop"><span class="charProgressLabel">WEEKLY</span><span class="charProgressPct">${weeklyPct}%</span></div><div class="charProgressTrack"><div class="charProgressFill" style="width:${weeklyPct}%"></div></div></div></div><div class="cardActions"><button type="button" class="collapseBtn" data-collapse=${ci} title="${tr('hide')}">⌃</button><button class=del data-del=${ci}>×</button></div></div><div class="cardContent">`+(()=>{
      const daily=tasks.map((t,ti)=>({t,ti})).filter(x=>x.t[1]=='d');
      const weekly=tasks.map((t,ti)=>({t,ti})).filter(x=>x.t[1]=='w');
      const rows=(arr)=>arr.map(({t,ti})=>`<label class="task ${t[1]=='w'?'weekly':''}"><input type=checkbox data-c=${ci} data-t=${ti} ${c.done?.[ti]?'checked':''}><span>${t[0]}</span></label>`).join('');
      return `<section class="taskSection dailySection"><div class="taskSectionHeader"><div class="taskSectionTitle">Daily</div><div class="taskSectionCount">${daily.length} TASKS</div></div>${rows(daily)}</section>
      <section class="taskSection weeklySection"><div class="taskSectionHeader"><div class="taskSectionTitle">Weekly</div><div class="taskSectionCount">${weekly.length} TASKS</div></div>${rows(weekly)}</section>`;
    })()+`</div>`;
    if(c.collapsed){
      card.classList.add('collapsed');
      const btn=card.querySelector('.collapseBtn');
      btn.textContent='⌄';
      btn.title=tr('show');
    }
    grid.append(card)
  })}


deleteAccountCancel.onclick=()=>deleteAccountDlg.close();
deleteAccountConfirm.onclick=()=>{
  if(accounts.length<=1){deleteAccountDlg.close();return;}
  const deletingId=account;
  const idx=accounts.findIndex(a=>a.id===deletingId);
  accounts=accounts.filter(a=>a.id!==deletingId);
  localStorage.removeItem(`aion2-new-${deletingId}`);
  localStorage.setItem(ACCOUNTS_KEY,JSON.stringify(accounts));
  const nextIndex=Math.min(Math.max(idx-1,0),accounts.length-1);
  account=accounts[nextIndex].id;
  localStorage.setItem(ACTIVE_KEY,account);
  data=loadData();
  deleteAccountDlg.close();
  render();
};
deleteAccountDlg.addEventListener('click',e=>{if(e.target===deleteAccountDlg)deleteAccountDlg.close()});

accountBtn.onclick=e=>{e.stopPropagation();accountMenu.classList.toggle('open')};
accountMenu.onclick=e=>{
  e.stopPropagation();
  let x=e.target.closest('[data-account]');
  if(x)return switchAccount(x.dataset.account);
  if(e.target.closest('#addAccountBtn')){
    accountMenu.classList.remove('open');
    accountName.value='';
    accountDlg.showModal();
    return;
  }
  if(e.target.closest('#deleteAccountBtn')){
    if(accounts.length<=1)return;
    accountMenu.classList.remove('open');
    const info=accounts.find(a=>a.id===account);
    deleteAccountName.textContent=info?.name||(currentLang==='ko'?'현재 계정':'Current Account');
    const aq=deleteAccountDlg.querySelector('p');
    aq.innerHTML=`<strong id="deleteAccountName">${esc(info?.name||(currentLang==='ko'?'현재 계정':'Current Account'))}</strong>${currentLang==='ko'?'을(를) 정말 삭제하시겠습니까?':' — are you sure you want to delete this account?'}`;
    deleteAccountDlg.showModal();
  }
};
document.addEventListener('click',e=>{
  accountMenu.classList.remove('open');
  const closeBtn=e.target.closest('[data-close]');
  if(closeBtn){
    const dlg=document.getElementById(closeBtn.dataset.close);
    if(dlg?.open) dlg.close();
  }
});
createAccountBtn.onclick=()=>{
  let name=accountName.value.trim();
  if(!name){accountName.focus();return;}
  let id='acc_'+Date.now().toString(36);
  accounts.push({id,name});
  localStorage.setItem(ACCOUNTS_KEY,JSON.stringify(accounts));
  account=id;
  localStorage.setItem(ACTIVE_KEY,id);
  data={chars:[]};
  save();
  accountName.value='';
  accountDlg.close();
  render();
};
addChar.onclick=()=>charDlg.showModal();
createCharBtn.onclick=()=>{
  let name=charName.value.trim();
  if(!name){charName.focus();return;}
  data.chars.push({name,role:charRole.value,done:{}});
  save();
  charName.value='';
  charDlg.close();
  render();
};
let pendingCharDelete=null;

accountName.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();createAccountBtn.click();}
});
charName.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();createCharBtn.click();}
});


let draggedCharIndex=null;

grid.addEventListener('dragstart',e=>{
  const card=e.target.closest('.card');
  if(!card)return;
  draggedCharIndex=Number(card.dataset.charIndex);
  card.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
  e.dataTransfer.setData('text/plain',String(draggedCharIndex));
});

grid.addEventListener('dragend',e=>{
  const card=e.target.closest('.card');
  if(card)card.classList.remove('dragging');
  grid.querySelectorAll('.card').forEach(x=>x.classList.remove('dropBefore','dropAfter'));
  draggedCharIndex=null;
});

grid.addEventListener('dragover',e=>{
  if(draggedCharIndex===null)return;
  const card=e.target.closest('.card');
  if(!card)return;
  e.preventDefault();
  e.dataTransfer.dropEffect='move';

  grid.querySelectorAll('.card').forEach(x=>x.classList.remove('dropBefore','dropAfter'));
  const r=card.getBoundingClientRect();
  const after=e.clientX > r.left+r.width/2;
  card.classList.add(after?'dropAfter':'dropBefore');
});

grid.addEventListener('drop',e=>{
  if(draggedCharIndex===null)return;
  const target=e.target.closest('.card');
  if(!target)return;
  e.preventDefault();

  const from=draggedCharIndex;
  let to=Number(target.dataset.charIndex);
  const r=target.getBoundingClientRect();
  const after=e.clientX > r.left+r.width/2;

  if(after)to++;
  if(from < to)to--;
  if(from===to){
    render();
    draggedCharIndex=null;
    return;
  }

  const [moved]=data.chars.splice(from,1);
  data.chars.splice(to,0,moved);
  save();
  render();
  draggedCharIndex=null;
});

grid.onclick=e=>{
  const emptyAddBtn=e.target.closest('#emptyAddCharBtn');
  if(emptyAddBtn){
    addChar.click();
    return;
  }

  if(e.target.matches('input')){
    let c=data.chars[e.target.dataset.c];
    c.done??={};
    c.done[e.target.dataset.t]=e.target.checked;
    save();
    render(); // refresh Daily/Weekly percentages immediately
    return;
  }
  const collapseBtn=e.target.closest('[data-collapse]');
  if(collapseBtn){
    const i=Number(collapseBtn.dataset.collapse);
    data.chars[i].collapsed=!data.chars[i].collapsed;
    save();
    render();
    return;
  }
  const delBtn=e.target.closest('[data-del]');
  if(delBtn){
    pendingCharDelete=Number(delBtn.dataset.del);
    const ch=data.chars[pendingCharDelete];
    deleteCharName.textContent=ch?.name||(currentLang==='ko'?'이 캐릭터':'This character');
    const cq=deleteCharDlg.querySelector('p');
    cq.innerHTML=currentLang==='ko'
      ?`<strong id="deleteCharName">${esc(ch?.name||'이 캐릭터')}</strong> 캐릭터를 정말 삭제하시겠습니까?`
      :`Are you sure you want to delete <strong id="deleteCharName">${esc(ch?.name||'this character')}</strong>?`;
    deleteCharDlg.showModal();
  }
};
deleteCharCancel.onclick=()=>{
  pendingCharDelete=null;
  deleteCharDlg.close();
};
deleteCharConfirm.onclick=()=>{
  if(pendingCharDelete===null)return;
  data.chars.splice(pendingCharDelete,1);
  save();
  render();
  pendingCharDelete=null;
  deleteCharDlg.close();
};
deleteCharDlg.addEventListener('cancel',()=>{pendingCharDelete=null});
deleteCharDlg.addEventListener('click',e=>{
  if(e.target===deleteCharDlg){
    pendingCharDelete=null;
    deleteCharDlg.close();
  }
});
dailyReset.onclick=()=>{data.chars.forEach(c=>tasks.forEach((t,i)=>{if(t[1]=='d'&&c.done)c.done[i]=false}));save();render()};
weeklyReset.onclick=()=>{data.chars.forEach(c=>tasks.forEach((t,i)=>{if(t[1]=='w'&&c.done)c.done[i]=false}));save();render()};
restore.onclick=()=>file.click();file.onchange=async()=>{try{let x=JSON.parse(await file.files[0].text());if(x.accounts&&x.accountData){if(Array.isArray(x.tasks)){tasks=x.tasks;saveTasks()}accounts=x.accounts;localStorage.setItem(ACCOUNTS_KEY,JSON.stringify(accounts));Object.entries(x.accountData).forEach(([id,d])=>localStorage.setItem(`aion2-new-${id}`,JSON.stringify(d)));account=x.activeAccount&&accounts.some(a=>a.id===x.activeAccount)?x.activeAccount:accounts[0].id;localStorage.setItem(ACTIVE_KEY,account);data=loadData()}else{data=x;save()}render()}catch{alert(tr('invalidBackup'))}};

function renderTaskManager(){taskManageList.innerHTML=tasks.map((t,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 4px;border-top:1px solid #294665"><b style="min-width:55px;color:${t[1]=='d'?'#70c8ff':'#c1a5ff'}">${t[1]=='d'?'DAILY':'WEEKLY'}</b><span style="flex:1">${esc(t[0])}</span><button type="button" data-task-del="${i}">×</button></div>`).join('')}
manage.onclick=()=>{renderTaskManager();newTaskName.value='';taskDlg.showModal()};
addTaskBtn.onclick=()=>{let n=newTaskName.value.trim();if(!n)return;tasks.push([n,newTaskType.value]);saveTasks();newTaskName.value='';renderTaskManager();render()};
taskManageList.onclick=e=>{let b=e.target.closest('[data-task-del]');if(!b)return;let i=+b.dataset.taskDel;tasks.splice(i,1);saveTasks();data.chars.forEach(c=>c.done={});save();renderTaskManager();render()};
backup.onclick=()=>{
  try{
    // Save the current account once more before building the backup.
    save();

    const p={version:3,accounts,activeAccount:account,tasks,accountData:{}};
    accounts.forEach(x=>{
      p.accountData[x.id]=JSON.parse(
        localStorage.getItem(`aion2-new-${x.id}`)||'{"chars":[]}'
      );
    });

    // Blob/object URL is more reliable than a very large data: URL,
    // especially now that the tracker contains embedded class emblems.
    const blob=new Blob([JSON.stringify(p,null,2)],{type:'application/json;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='aion2-tracker-backup.json';
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(err){
    console.error('Backup failed:',err);
    alert(currentLang==='ko'?'백업 파일을 만들지 못했습니다. 다시 시도해 주세요.':'Could not create the backup file. Please try again.');
  }
};

function updateHeaderTimers(){
  const now=new Date();
  localClockTime.textContent=now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  localClockDate.textContent=now.toLocaleDateString(
    currentLang==='ko' ? 'ko-KR' : 'en-US',
    currentLang==='ko'
      ? {year:'numeric',month:'long',day:'numeric',weekday:'short'}
      : {weekday:'short',month:'short',day:'numeric',year:'numeric'}
  );

  // Placeholder reset schedule until official AION2 reset times are confirmed:
  // Daily = next local midnight; Weekly = next Monday local midnight.
  const daily=new Date(now); daily.setHours(24,0,0,0);
  const dms=daily-now, dh=Math.floor(dms/3600000), dm=Math.floor((dms%3600000)/60000);
  dailyRemain.textContent=`${dh}h ${String(dm).padStart(2,'0')}m`;
  dailyOrb.style.setProperty('--p',`${(1-dms/86400000)*360}deg`);

  const weekly=new Date(now); let days=(8-now.getDay())%7; if(days===0)days=7;
  weekly.setDate(now.getDate()+days); weekly.setHours(0,0,0,0);
  const wms=weekly-now, wd=Math.floor(wms/86400000), wh=Math.floor((wms%86400000)/3600000);
  weeklyRemain.textContent=`${wd}d ${wh}h`;
  weeklyOrb.style.setProperty('--p',`${(1-Math.min(wms,604800000)/604800000)*360}deg`);
}
updateHeaderTimers();setInterval(updateHeaderTimers,1000);
