<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AION 2 Task Tracker</title>
<style>
:root{--bg:#0a1020;--panel:#121a2d;--panel2:#18233b;--text:#edf3ff;--muted:#94a4c5;--line:#283755;--accent:#87a2ff;--good:#43d49b;--bad:#ff7482}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#09101f,#111a31);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:1450px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}h1{margin:0;font-size:28px}.sub{color:var(--muted);font-size:13px;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.datetime{margin-top:9px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.datetime strong{color:var(--text);font-size:14px}
.resetTimers{flex-basis:100%;display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.resetinfo{padding:5px 10px;border-radius:999px;font-weight:600;white-space:nowrap}
#dailyResetInfo{background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.38);color:#86efac}
#weeklyResetInfo{background:rgba(168,85,247,.14);border:1px solid rgba(168,85,247,.38);color:#d8b4fe}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:8px 11px}.primary{background:var(--accent);color:#071020;border:0;font-weight:800}.bad{color:#ffadb6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat,.manage{background:rgba(18,26,45,.94);border:1px solid var(--line);border-radius:14px;padding:15px}.stat b{font-size:23px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.progress{height:8px;background:#26334d;border-radius:20px;overflow:hidden;margin-top:9px}.bar{height:100%;background:var(--good)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}.card{background:rgba(18,26,45,.95);border:1px solid var(--line);border-radius:15px;overflow:hidden}.cardhead{display:flex;justify-content:space-between;align-items:center;padding:14px 15px;border-bottom:1px solid var(--line)}.name{font-size:18px;font-weight:800}.role{font-size:12px;color:var(--muted)}.pct{font-weight:800;color:var(--good)}
.section{padding:12px 15px}.section h3{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0 0 7px}.task{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(40,55,85,.55)}.task:last-child{border:0}.task input{width:18px;height:18px;accent-color:var(--good)}.task.done label{text-decoration:line-through;color:#71809e}.task label{flex:1}
.manage{margin-top:18px}.managehead{display:flex;justify-content:space-between;align-items:center;gap:10px}.manage h2{margin:0;font-size:18px}.tasktable{margin-top:12px}.row{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.badge{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#0b1325;text-align:center}.rowactions{display:flex;gap:6px}
dialog{border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--text);width:min(470px,92vw);padding:0}dialog::backdrop{background:#000a}.modal{padding:20px}.modal h2{margin-top:0}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0b1325;color:var(--text)}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
@media(max-width:760px){.app{padding:13px}.top{flex-direction:column;align-items:flex-start}.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:75px 1fr}.rowactions{grid-column:2}}

.accountSwitcher{display:flex;gap:6px;align-items:center;padding:4px;background:#0b1325;border:1px solid var(--line);border-radius:12px;width:max-content;max-width:100%;margin-top:12px}
.accountTab{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:9px;font-weight:700;cursor:pointer;white-space:nowrap}
.accountTab.active{background:rgba(96,165,250,.18);color:#bfdbfe;box-shadow:inset 0 0 0 1px rgba(96,165,250,.35)}
@media(max-width:420px){.accountSwitcher{width:100%}.accountTab{flex:1;padding:8px 7px}}
</style></head>
<body><div class="app">
<div class="top"><div><h1>AION 2 Task Tracker <small style="font-size:12px;color:var(--muted)">v1.2</small></h1><div class="sub">Daily / Weekly 숙제를 자유롭게 추가·수정·삭제할 수 있습니다.</div>
    <div class="datetime"><strong id="liveDate">-</strong><span id="liveTime">-</span><span class="resetTimers"><span class="resetinfo" id="dailyResetInfo">Daily Reset: -</span><span class="resetinfo" id="weeklyResetInfo">Weekly Reset: -</span></span></div>
    <div class="accountSwitcher" role="tablist" aria-label="계정 선택">
      <button type="button" class="accountTab" id="accountMainBtn" onclick="switchAccount('main')">메인 계정</button>
      <button type="button" class="accountTab" id="accountAltBtn" onclick="switchAccount('alt')">배럭 계정</button>
    </div></div>
<div class="actions"><button id="addCharBtn" class="primary">+ 캐릭터 추가</button><button id="manageTaskBtn">숙제 관리</button><button type="button" id="dailyResetBtn" onclick="manualResetDaily()">Daily Reset</button><button type="button" id="weeklyResetBtn" onclick="manualResetWeekly()">Weekly Reset</button><button id="backupBtn">백업</button><button id="importBtn">불러오기</button><input id="importFile" type="file" accept=".json" hidden></div></div>
<div id="resetStatus" class="sub" style="min-height:18px;margin:-6px 0 8px"></div><div id="stats" class="stats"></div><div id="board" class="board"></div>
</div>
<dialog id="manageDialog"><div class="modal">
<div class="managehead"><div><h2>숙제 관리</h2><div class="sub">Daily / Weekly 숙제를 추가·수정·삭제할 수 있습니다.</div></div><button type="button" id="closeManage">닫기</button></div>
<div style="margin-top:14px"><button id="addTaskBtn" class="primary">+ 숙제 추가</button></div>
<div id="taskTable" class="tasktable"></div>
</div></dialog>

<dialog id="taskDialog"><form id="taskForm" class="modal">
<h2 id="taskDialogTitle">숙제 추가</h2><input id="taskId" type="hidden">
<div class="field"><label>숙제 이름</label><input id="taskName" required></div>
<div class="field"><label>구분</label><select id="taskType"><option value="daily">Daily</option><option value="weekly">Weekly</option></select></div>
<div class="modalactions"><button type="button" id="cancelTask">취소</button><button type="submit" class="primary">저장</button></div></form></dialog>

<dialog id="charDialog"><form id="charForm" class="modal">
<h2>캐릭터 추가</h2><div class="field"><label>캐릭터 이름</label><input id="charName" required></div><div class="field"><label>직업</label><input id="charRole"></div>
<div class="modalactions"><button type="button" id="cancelChar">취소</button><button type="submit" class="primary">저장</button></div></form></dialog>

<script>
const KEY='aion2-task-tracker-public-v1';
const ACCOUNT_KEY='aion2-task-tracker-active-account-v12';
const ACCOUNT_KEYS={main:'aion2-task-tracker-account-main-v12',alt:'aion2-task-tracker-account-alt-v12'};
let activeAccount=localStorage.getItem(ACCOUNT_KEY)||'main';
const fresh=()=>({tasks:[
{id:'d1',name:'원정/초월 던전 (파티)',type:'daily'},
{id:'d2',name:'사명 임무 퀘스트 (솔로)',type:'daily'},
{id:'d3',name:'슈고 페스타 (솔로)',type:'daily'},
{id:'d4',name:'보급 의뢰 (솔로)',type:'daily'},
{id:'d5',name:'일일 던전 (솔로)',type:'daily'},
{id:'w1',name:'각성전 (솔로)',type:'weekly'},
{id:'w2',name:'토벌전 (파티)',type:'weekly'},
{id:'w3',name:'어비스 PVP (솔로/파티)',type:'weekly'},
{id:'w4',name:'레이드 (10인 파티)',type:'weekly'}
],chars:[],lastDaily:'',lastWeekly:''});
function accountStorageKey(){return ACCOUNT_KEYS[activeAccount]||ACCOUNT_KEYS.main}
function loadAccount(){
  let raw=localStorage.getItem(accountStorageKey());
  if(!raw && activeAccount==='main'){
    const legacy=localStorage.getItem(KEY);
    if(legacy){localStorage.setItem(ACCOUNT_KEYS.main,legacy);raw=legacy}
  }
  try{return raw?JSON.parse(raw):fresh()}catch(e){return fresh()}
}
let data=loadAccount();
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(accountStorageKey(),JSON.stringify(data))}
function switchAccount(account){
  if(account!=='main'&&account!=='alt')return;
  save(); activeAccount=account; localStorage.setItem(ACCOUNT_KEY,account);
  data=loadAccount(); autoReset(); updateAccountTabs(); render();
}
function updateAccountTabs(){
  const m=$('accountMainBtn'),a=$('accountAltBtn'); if(!m||!a)return;
  m.classList.toggle('active',activeAccount==='main');
  a.classList.toggle('active',activeAccount==='alt');
}
function dayKey(){const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}
function weekKey(){const d=new Date(),j=new Date(d.getFullYear(),0,1);return d.getFullYear()+'-'+Math.floor(((d-j)/86400000+j.getDay())/7)}
function autoReset(){
  let changed=false;
  const today=dayKey(), week=weekKey();
  if(!data.lastDaily){ data.lastDaily=today; changed=true; }
  else if(data.lastDaily!==today){
    const ids=data.tasks.filter(t=>t.type==='daily').map(t=>t.id);
    data.chars.forEach(c=>{ if(!c.done)c.done={}; ids.forEach(id=>delete c.done[id]); });
    data.lastDaily=today; changed=true;
  }
  if(!data.lastWeekly){ data.lastWeekly=week; changed=true; }
  else if(data.lastWeekly!==week){
    const ids=data.tasks.filter(t=>t.type==='weekly').map(t=>t.id);
    data.chars.forEach(c=>{ if(!c.done)c.done={}; ids.forEach(id=>delete c.done[id]); });
    data.lastWeekly=week; changed=true;
  }
  if(changed) save();
}
function stat(label,a,b){const p=b?Math.round(a/b*100):0;return `<div class="stat"><b>${p}%</b><span>${label} · ${a}/${b}</span><div class="progress"><div class="bar" style="width:${p}%"></div></div></div>`}
function render(){
 autoReset(); const ds=data.tasks.filter(t=>t.type==='daily'),ws=data.tasks.filter(t=>t.type==='weekly');
 const total=data.tasks.length*data.chars.length,done=data.chars.reduce((n,c)=>n+data.tasks.filter(t=>c.done[t.id]).length,0);
 const dd=data.chars.reduce((n,c)=>n+ds.filter(t=>c.done[t.id]).length,0),wd=data.chars.reduce((n,c)=>n+ws.filter(t=>c.done[t.id]).length,0);
 $('stats').innerHTML=stat('전체 진행률',done,total)+stat('Daily',dd,ds.length*data.chars.length)+stat('Weekly',wd,ws.length*data.chars.length)+`<div class="stat"><b>${data.chars.length}</b><span>캐릭터</span><div class="progress"><div class="bar" style="width:100%"></div></div></div>`;
 $('board').innerHTML=data.chars.length?data.chars.map(card).join(''):'<div class="empty"><b>등록된 캐릭터가 없습니다.</b><br><br>상단의 <b>+ 캐릭터 추가</b> 버튼을 눌러 시작하세요.</div>';
 $('taskTable').innerHTML=data.tasks.length?data.tasks.map(t=>`<div class="row"><div class="badge">${t.type==='daily'?'DAILY':'WEEKLY'}</div><div>${esc(t.name)}</div><div class="rowactions"><button data-edit="${t.id}">수정</button><button class="bad" data-delete="${t.id}">삭제</button></div></div>`).join(''):'<div class="empty">숙제가 없습니다. + 숙제 추가를 눌러주세요.</div>';
 save();
}
function card(c){const d=data.tasks.filter(t=>t.type==='daily'),w=data.tasks.filter(t=>t.type==='weekly'),n=data.tasks.filter(t=>c.done[t.id]).length,p=data.tasks.length?Math.round(n/data.tasks.length*100):0;return `<div class="card"><div class="cardhead"><div><div class="name">${esc(c.name)}</div><div class="role">${esc(c.role||'직업 미설정')}</div></div><div><span class="pct">${p}%</span> <button class="bad" data-char-delete="${c.id}">삭제</button></div></div>${section(c,d,'DAILY')}${section(c,w,'WEEKLY')}</div>`}
function section(c,a,title){return `<div class="section"><h3>${title}</h3>${a.length?a.map(t=>`<div class="task ${c.done[t.id]?'done':''}"><input type="checkbox" data-cid="${c.id}" data-tid="${t.id}" ${c.done[t.id]?'checked':''}><label>${esc(t.name)}</label></div>`).join(''):'<div class="role">등록된 숙제가 없습니다.</div>'}</div>`}
function openTask(id=''){const t=data.tasks.find(x=>x.id===id);$('taskDialogTitle').textContent=t?'숙제 수정':'숙제 추가';$('taskId').value=t?.id||'';$('taskName').value=t?.name||'';$('taskType').value=t?.type||'daily';$('taskDialog').showModal();setTimeout(()=>$('taskName').focus(),0)}
$('manageTaskBtn').onclick=()=>{$('manageDialog').showModal()}
$('closeManage').onclick=()=>$('manageDialog').close();
$('addTaskBtn').onclick=()=>openTask();
$('cancelTask').onclick=()=>$('taskDialog').close();
$('taskForm').onsubmit=e=>{e.preventDefault();const id=$('taskId').value,name=$('taskName').value.trim(),type=$('taskType').value;if(!name)return;if(id){const t=data.tasks.find(x=>x.id===id);t.name=name;t.type=type}else data.tasks.push({id:'t'+Date.now(),name,type});$('taskDialog').close();render()}
$('taskTable').onclick=e=>{const edit=e.target.dataset.edit,del=e.target.dataset.delete;if(edit)openTask(edit);if(del&&confirm('이 숙제를 모든 캐릭터에서 삭제할까요?')){data.tasks=data.tasks.filter(t=>t.id!==del);data.chars.forEach(c=>delete c.done[del]);render()}}
$('board').onchange=e=>{if(e.target.matches('input[type=checkbox]')){const c=data.chars.find(x=>x.id===e.target.dataset.cid);c.done[e.target.dataset.tid]=e.target.checked;render()}}
$('board').onclick=e=>{const id=e.target.dataset.charDelete;if(id&&confirm('이 캐릭터를 삭제할까요?')){data.chars=data.chars.filter(c=>c.id!==id);render()}}
$('addCharBtn').onclick=()=>{$('charName').value='';$('charRole').value='';$('charDialog').showModal()}
$('cancelChar').onclick=()=>$('charDialog').close();
$('charForm').onsubmit=e=>{e.preventDefault();data.chars.push({id:'c'+Date.now(),name:$('charName').value.trim(),role:$('charRole').value.trim(),done:{}});$('charDialog').close();render()}
function clearTaskChecks(type){
  const ids=data.tasks.filter(function(t){return t.type===type}).map(function(t){return t.id});
  data.chars.forEach(function(c){
    if(!c.done)c.done={};
    ids.forEach(function(id){delete c.done[id]});
  });
  if(type==='daily') data.lastDaily=dayKey();
  if(type==='weekly') data.lastWeekly=weekKey();
  localStorage.setItem(KEY,JSON.stringify(data));
}
function manualResetDaily(){
  clearTaskChecks('daily');
  render();
  document.getElementById('resetStatus').textContent='Daily 숙제 체크를 모두 해제했습니다.';
}
function manualResetWeekly(){
  clearTaskChecks('weekly');
  render();
  document.getElementById('resetStatus').textContent='Weekly 숙제 체크를 모두 해제했습니다.';
}
$('backupBtn').onclick=()=>{const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='AION2_Tracker_Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.tasks)||!Array.isArray(x.chars))throw 0;if(confirm('현재 데이터를 백업 파일로 교체할까요?')){data=x;render()}}catch(_){alert('올바른 백업 파일이 아닙니다.')}};r.readAsText(f);e.target.value=''}

function updateClock(){
  const now=new Date();
  const dateFmt=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'});
  const timeFmt=new Intl.DateTimeFormat('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
  document.getElementById('liveDate').textContent=dateFmt.format(now);
  document.getElementById('liveTime').textContent=timeFmt.format(now);

  // This tracker currently resets Daily when the local calendar date changes,
  // and Weekly when the local week key changes (Sunday boundary).
  const nextDay=new Date(now); nextDay.setHours(24,0,0,0);
  const daysToSun=(7-now.getDay())%7 || 7;
  const nextWeek=new Date(now); nextWeek.setDate(now.getDate()+daysToSun); nextWeek.setHours(0,0,0,0);

  const dailyDiffText=(target)=>{
    let ms=Math.max(0,target-now),h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000);
    return `${h}시간 ${m}분`;
  };
  const weeklyDiffText=(target)=>{
    let ms=Math.max(0,target-now);
    const d=Math.floor(ms/86400000);
    const h=Math.floor((ms%86400000)/3600000);
    const m=Math.floor((ms%3600000)/60000);
    return `${d}일 ${h}시간 ${m}분`;
  };
  document.getElementById('dailyResetInfo').textContent='Daily Reset까지 '+dailyDiffText(nextDay);
  document.getElementById('weeklyResetInfo').textContent='Weekly Reset까지 '+weeklyDiffText(nextWeek);
}
setInterval(updateClock,1000);
updateClock();

render();
updateAccountTabs();
</script></body></html>
